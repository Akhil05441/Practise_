#create a workflow for backend ci that triggers on push and pull request events to the main branch
name: Backend CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
#job name build-and-test on ubuntu-latest using node 18 & install deps & tests
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test   